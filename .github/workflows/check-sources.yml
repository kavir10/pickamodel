name: Check data sources

# Weekly: every model, benchmark, and score source URL must still resolve, and the dataset must have
# been re-checked in the last 30 days (content/models/index.ts dataAsOf). A failure emails the repo owner.
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run check-sources

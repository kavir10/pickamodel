name: Data correction
description: A price, limit, or benchmark score on pickamodel.dev is wrong or out of date.
title: "Data correction: "
labels: [data]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The pickamodel.dev URL where you saw it.
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What's wrong
      description: The value shown, and what it should be.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: A link to the vendor page, model card, or leaderboard that shows the right value.
    validations:
      required: true
